    <!-- ═══════════════════════════════════════════════════════════════
         FIREBASE CONFIG — SECURE ARCHITECTURE v4.0

         SECURITY RULES (Paste in Firebase Console → Firestore → Rules):
         ───────────────────────────────────────────────────────────────
         rules_version = '2';
         service cloud.firestore {
           match /databases/{database}/documents {
             function isAuthenticated() {
               return request.auth != null;
             }
             function isAdmin() {
               return isAuthenticated() &&
                 get(/databases/$(database)/documents/users/$(request.auth.uid)).data.role == 'admin';
             }
             function isTeacher() {
               return isAuthenticated() &&
                 get(/databases/$(database)/documents/users/$(request.auth.uid)).data.role == 'teacher';
             }
             match /users/{uid} {
               allow read: if isAuthenticated() && request.auth.uid == uid;
               allow write: if isAdmin();
             }
             match /teachers/{uid} {
               allow read: if isAuthenticated() && request.auth.uid == uid;
               allow write: if isAdmin();
             }
             match /students/{myKid} {
               allow get: if true;           // Parent: direct MyKid access
               allow list: if isAdmin();     // NO public bulk listing
               allow create, update, delete: if isAdmin();
             }
             match /assessments/{assId} {
               allow get: if true;           // Parent: direct assessment ID
               allow list: if isAdmin() || isTeacher();
               allow create, update, delete: if isAdmin();
             }
             match /stemMissions/{missionId} {
               allow read: if isAuthenticated();
               allow write: if isAdmin();
             }
             match /{document=**} {
               allow read, write: if false;
             }
           }
         }
         ───────────────────────────────────────────────────────────────

         SECURITY FIXES APPLIED:
         ✅ Document ID = MyKid (no query-based data dumps)
         ✅ Assessments in subcollections (path-based security)
         ✅ XSS sanitization on all user data outputs
         ✅ Hardcoded demo credentials removed
         ✅ Direct getDoc() for parent portal (not query)
    ═══════════════════════════════════════════════════════════════ -->
